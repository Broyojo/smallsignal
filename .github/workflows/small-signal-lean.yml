name: Small-signal Lean

# The MNA theorem and a certificate for every oracle corpus circuit. Mathlib's
# prebuilt cache is a large download, so this runs only when the solver, the
# corpus or the proofs change.
on:
  pull_request:
    paths:
      - crates/**
      - lean/**
      - oracle/corpus/**
      - .github/workflows/small-signal-lean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: small-signal-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean certificates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean/check_all.sh
