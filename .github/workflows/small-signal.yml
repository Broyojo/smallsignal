name: Small-signal

# The small-signal solver and panel: Rust tests, the ngspice and textbook
# oracles, the unit tests, a static build and the panel's browser tests.
on:
  pull_request:
  # A merge queue tests the candidate merged with current main.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: small-signal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solver:
    name: Solver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --release -- -D warnings
      - run: cargo test --locked --workspace --release
      - run: cargo build --locked --release -p smallsignal-cli
      - uses: astral-sh/setup-uv@v6
      - name: ngspice corpus, regressions and textbook identities
        working-directory: oracle
        env:
          SMALLSIGNAL_BIN: ${{ github.workspace }}/target/release/smallsignal
        run: |
          # compare.py walks the expected results, so first make sure every
          # circuit has one (and that there are circuits at all).
          for set in corpus:expected regressions:regressions/expected; do
            circuits="${set%%:*}" results="${set#*:}"
            diff <(cd "$circuits" && ls *.cir | sed 's/\.cir$//') \
                 <(cd "$results" && ls *.json | sed 's/\.json$//')
            test -n "$(ls "$circuits"/*.cir)"
          done
          # compare.py runs the netlist a result names: it must be its own.
          python3 - <<'EOF'
          import json, pathlib, sys
          bad = [
              f"{path}: names {name}"
              for results in ("expected", "regressions/expected")
              for path in sorted(pathlib.Path(results).glob("*.json"))
              if (name := json.loads(path.read_text())["netlist"]) != path.stem + ".cir"
          ]
          sys.exit("\n".join(bad) or None)
          EOF
          uv run --locked compare.py
          uv run --locked compare.py --corpus regressions --expected regressions/expected
          uv run --locked textbook.py

  editor:
    name: Panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build solver WASM
        # As in Pages: without the solver crate, the panel runs on its stub.
        run: |
          if [ -d crates/smallsignal-wasm ]; then
            wasm-pack build crates/smallsignal-wasm --target web --release \
              --out-dir ../../packages/small-signal/wasm -- --locked
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm --filter "@icm/editor^..." --if-present build
      - run: pnpm typecheck
      - run: pnpm exec vitest run packages/small-signal apps/editor/src/features/small-signal
      - name: Static build, as Pages deploys it
        env:
          ICM_BASE: /smallsignal/
          ICM_STATIC_PAGES: "1"
        run: pnpm --filter @icm/editor build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests against that build, served at /smallsignal/
        run: |
          (cd apps/editor && pnpm exec vite preview --outDir dist --base /smallsignal/ \
            --host 127.0.0.1 --port 4180 --strictPort) &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:4180/smallsignal/ >/dev/null && break
            sleep 1
          done
          ICM_E2E_BASE_URL=http://127.0.0.1:4180/smallsignal \
            pnpm exec playwright test apps/editor/e2e/small-signal.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
